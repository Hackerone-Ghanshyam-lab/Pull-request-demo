name: PR Merge Security Lab

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  lab:
    runs-on: ubuntu-latest

    steps:
      - name: Security Lab
        run: |
          echo "PR received"
          echo "Workflow has write permission"
          echo "Workflow has pull-request write permission"
          echo "An unsafe implementation could now modify/merge the PR."
