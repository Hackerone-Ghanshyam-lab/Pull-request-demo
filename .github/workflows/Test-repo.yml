name: Vulnerable PR Lab

on:
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  security-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Security Impact
        env:
          LAB_SECRET: ${{ secrets.LAB_SECRET }}
        run: |
          echo "=== SECURITY LAB ==="
          echo "Privileged workflow is executing PR code."
          echo "Repository secret is available to this job."
          echo "This combination creates a secret-exposure risk."
