name: Vulnerable PR Security Lab

on:
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  security-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true

      - name: Show Security Context
        env:
          LAB_SECRET: ${{ secrets.LAB_SECRET }}
        run: |
          echo "================================"
          echo "       SECURITY LAB"
          echo "================================"
          echo "Workflow: pull_request_target"
          echo "PR code: checked out"
          echo "Repository write permission: ENABLED"
          echo "Repository secret: AVAILABLE TO JOB"
          echo "================================"
          echo "This combination is dangerous."
          echo "Untrusted PR code is running in a privileged context."
