name: Secure PR Lab

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Security checks
        run: |
          echo "Running security checks..."
          echo "PR must pass all checks before merge."
